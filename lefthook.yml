pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,ts,tsx,json,md}'
      run: yarn prettier --write {staged_files} && git add {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.{js,ts,tsx}'
      run: npx eslint {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
